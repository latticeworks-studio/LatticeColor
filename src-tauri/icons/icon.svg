<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#252526"/>

  <!-- Color wheel arc segments (analogous palette hint) -->
  <path d="M64 14 A50 50 0 0 1 97 24" stroke="#52D7C6" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M97 24 A50 50 0 0 1 111 57" stroke="#4fc1ff" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M111 57 A50 50 0 0 1 97 90" stroke="#4ec9b0" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Eyedropper body -->
  <rect x="55" y="42" width="22" height="34" rx="4" fill="#3e3e42"/>
  <rect x="59" y="46" width="14" height="22" rx="2" fill="#52D7C6" opacity="0.25"/>

  <!-- Eyedropper tip -->
  <path d="M64 76 L60 86 L64 92 L68 86 Z" fill="#52D7C6"/>

  <!-- Eyedropper cap/top -->
  <rect x="57" y="36" width="18" height="10" rx="3" fill="#6a6a6a"/>
  <rect x="62" y="30" width="8" height="10" rx="2" fill="#6a6a6a"/>

  <!-- Highlight dot on tip -->
  <circle cx="64" cy="91" r="2.5" fill="#1e1e1e"/>

  <!-- Small color swatch dot -->
  <circle cx="84" cy="52" r="7" fill="#52D7C6"/>
  <circle cx="84" cy="52" r="4" fill="#1e1e1e" opacity="0.3"/>
</svg>
